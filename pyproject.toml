[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kvfolio-paged-block-attention"
version = "0.1.0"
description = "PagedAttention & block-paged KV-cache virtual memory: zero external fragmentation, copy-on-write beam branching, online-softmax decode over non-contiguous physical blocks"
authors = [{name = "Sunzzx & Hermes AI"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
]
keywords = [
    "paged-attention",
    "kv-cache",
    "virtual-memory",
    "vllm",
    "transformers",
    "online-softmax",
    "copy-on-write",
    "llm-serving",
    "flashattention",
    "memory-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/Sunzzx/kvfolio-paged-block-attention"
Repository = "https://github.com/Sunzzx/kvfolio-paged-block-attention"
Issues = "https://github.com/Sunzzx/kvfolio-paged-block-attention/issues"
Sponsor = "https://github.com/sponsors/Sunzzx"
License-Commercial = "https://buy.stripe.com/test_kvfolio_enterprise"
Documentation = "https://github.com/Sunzzx/kvfolio-paged-block-attention#readme"

[project.scripts]
kvfolio = "kvfolio.demo:main"
kvfolio-demo = "kvfolio.demo:main"
paged-attention = "kvfolio.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kvfolio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
